# Databricks Asset Bundle for the RAG POC.
# Pipeline (job) definitions live in separate files under resources/ and are
# pulled in via the `include` directive below. Edit those files to change a
# pipeline. Credentials come from the CLI profile; do not add tokens here.
bundle:
  name: rag-poc

# Pipeline/job definitions are kept in their own YAML files.
include:
  - resources/*.yml

variables:
  prod_host:
    description: Workspace URL for the prod target (set before running -t prod)
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-c4b8c8d6-ec5b.cloud.databricks.com
      profile: sairam

  prod:
    mode: production
    workspace:
      host: ${var.prod_host}
      profile: sairam
