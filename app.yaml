# Databricks Apps runtime config for the RAG chatbot.
# The app runs Streamlit and talks to Databricks serving endpoints + Vector Search
# using the App's own identity (service principal) -- no profile or token needed.
#
# This file lives at the source-code root so `app/chatbot.py` can import `src/`.
# Dependencies come from requirements.txt at this same root.

command:
  - streamlit
  - run
  - app/chatbot.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"
  - --server.headless
  - "true"

env:
  # Name shown in the top-right badge. Change this to display a different name,
  # or remove it to show the logged-in Databricks user instead.
  - name: RAG_USER_NAME
    value: "Teja Kota"
  # Managed-embeddings Vector Search index (ai_parse_document + ai_prep_search).
  # It embeds queries itself, so no embedding endpoint is needed here.
  - name: RAG_INDEX_NAME
    value: "databricks_rag_dev.rag.document_chunks_ai_index"
  - name: RAG_CHAT_ENDPOINT
    value: "databricks-meta-llama-3-1-8b-instruct"
