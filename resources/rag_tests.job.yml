# Test pipeline: runs the pytest suite on serverless and logs per-test results
# to the test_log Delta table. Every notebook widget is supplied from this file.
#
# Every `default:` below reads a bundle VARIABLE (declared in databricks.yml), not
# a literal - so tests run against (and log to) the right catalog/schema for
# whichever target this is deployed with (`-t dev` vs `-t prod`).
resources:
  jobs:
    rag_tests:
      name: "[${bundle.target}] RAG Tests"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: test_log_table
          default: ${var.test_log_table}
      tasks:
        - task_key: run_tests
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/run_tests
            base_parameters:
              # The synced files path so the notebook can import src/ and find tests/.
              project_root: ${workspace.file_path}
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              test_log_table: "{{job.parameters.test_log_table}}"
          # No cluster config = serverless compute.
