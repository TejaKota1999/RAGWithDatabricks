# Custom ingestion pipeline: runs notebooks 02 -> 03 -> 04 -> 05 in order on
# serverless. ALL notebook widgets across all 4 tasks are job-level `parameters`
# here, so every one of them is visible AND editable from the job's "Job
# parameters" panel / "Run now" dialog in the Databricks UI - nothing is a fixed
# literal buried inside a task's base_parameters. The notebooks' own widget
# defaults are only a fallback for an ad-hoc manual run of a notebook by itself
# (outside the job); whenever this runs as the `rag_ingest` job, every value below
# (and only these) is what actually gets used.
#
# Every `default:` below reads a bundle VARIABLE (declared in databricks.yml), not
# a literal - so the actual value used depends on the TARGET this is deployed with
# (`-t dev` vs `-t prod`). See databricks.yml's `variables:`/`targets:` blocks to
# change an environment's value or to add a new environment.
resources:
  jobs:
    rag_ingest:
      name: "[${bundle.target}] RAG Ingest Pipeline"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        # "true" = incremental (only new/changed docs); "false" = full rebuild.
        # A run-time toggle, not an environment setting, so it is the same
        # literal in every target (override it per-run with --params instead).
        - name: incremental
          default: "true"
        # Create/sync the Vector Search index (maps to 05 create_resources).
        - name: create_index
          default: "true"
        # Rebuild the index from scratch (only if the embedding dimension changes).
        - name: recreate_index
          default: "false"

        # --- 02_extract_and_clean ---
        # UC volume (under catalog.schema) holding the source documents.
        - name: volume
          default: ${var.volume}
        # Optional sub-path filter inside the volume ("" = whole volume).
        - name: source_path
          default: ${var.source_path}
        # File extensions 02 will parse; anything else is skipped.
        - name: supported_extensions
          default: ${var.supported_extensions}
        # Drop any extracted document shorter than this many characters.
        - name: min_chars
          default: ${var.min_chars}
        # Output Delta table for cleaned/extracted text (02's output).
        - name: cleaned_table
          default: ${var.cleaned_table}
        # Persist the cleaned table to Delta ("true") vs. preview only ("false").
        - name: save_cleaned
          default: ${var.save_cleaned}

        # --- 03_chunk_documents / 04_generate_embeddings (shared table name) ---
        # Output Delta table for chunks (03's output, 04's input).
        - name: chunks_table
          default: ${var.custom_chunks_table}
        # Target characters per chunk.
        - name: chunk_size
          default: ${var.chunk_size}
        # Overlap (characters) between consecutive chunks.
        - name: chunk_overlap
          default: ${var.chunk_overlap}
        # Drop any chunk shorter than this many characters (avoids noise chunks).
        - name: min_chunk_chars
          default: ${var.min_chunk_chars}
        # Persist the chunks table to Delta ("true") vs. preview only ("false").
        - name: save_chunks
          default: ${var.save_chunks}

        # --- 04_generate_embeddings ---
        # Output Delta table for embeddings (04's output, 05's input).
        - name: embeddings_table
          default: ${var.embeddings_table}
        # Databricks embedding serving endpoint (self-managed path, 1024-dim).
        - name: embedding_endpoint
          default: ${var.custom_embedding_endpoint}
        # How many chunks to embed per API call to the serving endpoint.
        - name: batch_size
          default: ${var.batch_size}
        # L2-normalize embedding vectors before storing them.
        - name: normalize
          default: ${var.normalize}
        # Persist the embeddings table to Delta ("true") vs. preview only ("false").
        - name: save_embeddings
          default: ${var.save_embeddings}

        # --- Shared write mode (02/03/04 each overwrite their output table) ---
        - name: write_mode
          default: ${var.write_mode}

        # --- 05_create_ai_search_index ---
        # The self-managed (vector-column) Vector Search index name.
        - name: index_table
          default: ${var.custom_index_table}
        # Vector Search endpoint that hosts the index.
        - name: endpoint_name
          default: ${var.vs_endpoint_name}
        # STANDARD (serverless-friendly) vs other Vector Search endpoint tiers.
        - name: endpoint_type
          default: ${var.endpoint_type}
        # Unique-id column in the embeddings table (index primary key).
        - name: primary_key
          default: ${var.primary_key}
        # Column in the embeddings table holding the 1024-dim vector.
        - name: embedding_column
          default: ${var.embedding_column}
        # Must match the embedding endpoint's output dimension.
        - name: embedding_dim
          default: ${var.embedding_dim}
        # TRIGGERED = sync on demand (vs CONTINUOUS, which stays always-on).
        - name: pipeline_type
          default: ${var.pipeline_type}

      tasks:
        # 1) Extract + clean text from the volume -> documents_cleaned
        - task_key: extract_and_clean
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/custom/02_extract_and_clean
            # Every base_parameter below is a straight pass-through of the job
            # parameter of the same name - nothing is hardcoded in this task.
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "{{job.parameters.volume}}"
              source_path: "{{job.parameters.source_path}}"
              supported_extensions: "{{job.parameters.supported_extensions}}"
              min_chars: "{{job.parameters.min_chars}}"
              cleaned_table: "{{job.parameters.cleaned_table}}"
              write_mode: "{{job.parameters.write_mode}}"
              save_cleaned: "{{job.parameters.save_cleaned}}"
              incremental: "{{job.parameters.incremental}}"

        # 2) Chunk the cleaned text -> document_chunks
        - task_key: chunk_documents
          depends_on:
            - task_key: extract_and_clean
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/custom/03_chunk_documents
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              # Reads 02's output table (named by the job's `cleaned_table` param).
              source_table: "{{job.parameters.cleaned_table}}"
              chunks_table: "{{job.parameters.chunks_table}}"
              chunk_size: "{{job.parameters.chunk_size}}"
              chunk_overlap: "{{job.parameters.chunk_overlap}}"
              min_chunk_chars: "{{job.parameters.min_chunk_chars}}"
              write_mode: "{{job.parameters.write_mode}}"
              save_chunks: "{{job.parameters.save_chunks}}"
              incremental: "{{job.parameters.incremental}}"

        # 3) Embed the chunks via the Databricks endpoint -> document_embeddings
        - task_key: generate_embeddings
          depends_on:
            - task_key: chunk_documents
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/custom/04_generate_embeddings
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              # Reads 03's output table (same job parameter as above).
              chunks_table: "{{job.parameters.chunks_table}}"
              embeddings_table: "{{job.parameters.embeddings_table}}"
              embedding_endpoint: "{{job.parameters.embedding_endpoint}}"
              batch_size: "{{job.parameters.batch_size}}"
              normalize: "{{job.parameters.normalize}}"
              write_mode: "{{job.parameters.write_mode}}"
              save_embeddings: "{{job.parameters.save_embeddings}}"
              incremental: "{{job.parameters.incremental}}"

        # 4) Create or sync the Vector Search index
        - task_key: create_or_sync_index
          depends_on:
            - task_key: generate_embeddings
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/custom/05_create_ai_search_index
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              # Reads 04's output table (same job parameter as above).
              source_table: "{{job.parameters.embeddings_table}}"
              index_table: "{{job.parameters.index_table}}"
              endpoint_name: "{{job.parameters.endpoint_name}}"
              endpoint_type: "{{job.parameters.endpoint_type}}"
              primary_key: "{{job.parameters.primary_key}}"
              embedding_column: "{{job.parameters.embedding_column}}"
              embedding_dim: "{{job.parameters.embedding_dim}}"
              pipeline_type: "{{job.parameters.pipeline_type}}"
              # The query-time embedding endpoint must match the one used to embed
              # the chunks, so it reuses the same job parameter.
              query_endpoint: "{{job.parameters.embedding_endpoint}}"
              recreate_index: "{{job.parameters.recreate_index}}"
              create_resources: "{{job.parameters.create_index}}"
