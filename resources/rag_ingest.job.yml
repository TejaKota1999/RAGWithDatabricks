# Custom ingestion pipeline: runs notebooks 02 -> 03 -> 04 -> 05 in order on
# serverless. EVERY notebook widget is supplied from this file: the commonly
# overridden ones are job `parameters` (editable at run time), the per-stage ones
# are explicit `base_parameters` values. The notebook widget defaults are only a
# fallback and are always overridden here.
resources:
  jobs:
    rag_ingest:
      name: "[${bundle.target}] RAG Ingest Pipeline"
      parameters:
        - name: catalog
          default: databricks_rag_dev
        - name: schema
          default: rag
        # "true" = incremental (only new/changed docs); "false" = full rebuild.
        - name: incremental
          default: "true"
        # Create/sync the Vector Search index (maps to 05 create_resources).
        - name: create_index
          default: "true"
        # Rebuild the index from scratch (only if the embedding dimension changes).
        - name: recreate_index
          default: "false"

      tasks:
        # 1) Extract + clean text from the volume -> documents_cleaned
        - task_key: extract_and_clean
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/custom/02_extract_and_clean
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume: "source_docs"
              source_path: ""
              supported_extensions: "pdf,txt,md,docx"
              min_chars: "20"
              cleaned_table: "documents_cleaned"
              write_mode: "overwrite"
              save_cleaned: "true"
              incremental: "{{job.parameters.incremental}}"

        # 2) Chunk the cleaned text -> document_chunks
        - task_key: chunk_documents
          depends_on:
            - task_key: extract_and_clean
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/custom/03_chunk_documents
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              source_table: "documents_cleaned"
              chunks_table: "document_chunks"
              chunk_size: "1000"
              chunk_overlap: "150"
              min_chunk_chars: "60"
              write_mode: "overwrite"
              save_chunks: "true"
              incremental: "{{job.parameters.incremental}}"

        # 3) Embed the chunks via the Databricks endpoint -> document_embeddings
        - task_key: generate_embeddings
          depends_on:
            - task_key: chunk_documents
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/custom/04_generate_embeddings
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              chunks_table: "document_chunks"
              embeddings_table: "document_embeddings"
              embedding_endpoint: "databricks-qwen3-embedding-0-6b"
              batch_size: "16"
              normalize: "true"
              write_mode: "overwrite"
              save_embeddings: "true"
              incremental: "{{job.parameters.incremental}}"

        # 4) Create or sync the Vector Search index
        - task_key: create_or_sync_index
          depends_on:
            - task_key: generate_embeddings
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/custom/05_create_ai_search_index
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              source_table: "document_embeddings"
              index_table: "document_chunks_index"
              endpoint_name: "rag_poc_vs"
              endpoint_type: "STANDARD"
              primary_key: "chunk_id"
              embedding_column: "embedding"
              embedding_dim: "1024"
              pipeline_type: "TRIGGERED"
              query_endpoint: "databricks-qwen3-embedding-0-6b"
              recreate_index: "{{job.parameters.recreate_index}}"
              create_resources: "{{job.parameters.create_index}}"
